<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>A1: Hello World, GitHub and d3</title>
</head>
<body>
  <div id="container"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    console.log("d3 version", d3.version); // test that d3 loaded
    // Add an SVG    
    const width = 1500;
    const height = 950;
    const startSunY = 190;
    const svg = d3.select("#container")
      .append("svg")
      .attr("width", width)
      .attr("height", height);
    // Background Color (Gradient)
    const gradient = svg.append("defs")
      .append("linearGradient")
      .attr("id", "sky")
      .attr("x1", "0%")
      .attr("y1", "0%")
      .attr("x2", "0%")
      .attr("y2", "100%");

    const topStop = gradient.append("stop")
      .attr("offset", "0%")
      .attr("stop-color", "#007FFF");
    
    const bottomStop = gradient.append("stop")
      .attr("offset", "100%")
      .attr("stop-color", "#cce5ff");

    svg.append("rect")
      .attr("width", width)
      .attr("height", height)
      .attr("fill", "url(#sky)");
    // Add Rectangles

    const sun = svg.append("circle")
      .attr("cx", 200)
      .attr("cy", startSunY)
      .attr("r", 125)
      .attr("fill", "yellow");

    const grass = svg.append("rect")
      .attr("x", 0)
      .attr("y", 800)
      .attr("fill", "green")
      .attr("width", 1500)
      .attr("height", 150)
    
    const house = svg.append("rect")
      .attr("x", 1100)
      .attr("y", 600)
      .attr("fill", "red")
      .attr("width", 300)
      .attr("height", 250);
    
    const door = svg.append("rect")
      .attr("x", 1210)
      .attr("y", 750)
      .attr("fill", "black")
      .attr("width", 75)
      .attr("height", 100);
    
    function animateDayNight() {
      topStop.transition()
        .duration(3000)
        .attr("stop-color", "#2A3439");
      bottomStop.transition()
        .duration(3000)
        .attr("stop-color", "#91A3B0");
      
      sun.transition()
        .duration(3000)
        .attr("cy", height)
        .attr("fill", "lightgray")
        .transition()
        .duration(3000)
        .attr("cy", startSunY);
    }
    animateDayNight();

    // Add Lines
    
    const trunk = svg.append("rect")
      .attr("x", 825)
      .attr("y", 550)
      .attr("width", 50)
      .attr("height", 350)
      .attr("fill", "brown");

    const branch1 = svg.append("line")
      .attr("x1", 850)
      .attr("y1", 650)
      .attr("x2", 750)
      .attr("y2", 500)
      .attr("stroke", "brown")
      .attr("stroke-width", 22);

    const branch2 = svg.append("line")
      .attr("x1", 850)
      .attr("y1", 650)
      .attr("x2", 950)
      .attr("y2", 500)
      .attr("stroke", "brown")
      .attr("stroke-width", 22);
    
    svg.append("circle")
      .attr("cx", 750)
      .attr("cy", 500)
      .attr("r", 75)
      .attr("fill", "darkgreen");

    svg.append("circle")
      .attr("cx", 950)
      .attr("cy", 500)
      .attr("r", 75)
      .attr("fill", "darkgreen");

    svg.append("circle")
      .attr("cx", 850)
      .attr("cy", 480)
      .attr("r", 75)
      .attr("fill", "darkgreen");

    // Add Polygons
    const roof = svg.append("polygon")
      .attr("points", "1050,600 1250,400 1450,600")
      .attr("fill", "blue");
  </script>
</body>
</html>
